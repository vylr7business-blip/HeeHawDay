<title>HeeHawDay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen isometric farm map (canvas) you drag around; chunky game HUD floats on top; wooden pop-up panels for barn, mill, orders and animal roster. Single sunny look. */
:root{
  --ink:#3a2414; --cream:#fff4d6; --cream2:#f7e3b5; --wood:#9a5b2c; --wood-dk:#6b3a17; --wood-lt:#d79a57;
  --green:#5cb82e; --green-dk:#3d8a1a; --gold:#ffc531; --gold-dk:#d68f00; --red:#e04a2f; --red-dk:#a92d17; --sky:#9fd85a;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif; --body:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:#79b93d;color:var(--ink);font-family:var(--body);font-weight:600;-webkit-user-select:none;user-select:none}
*{box-sizing:border-box}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
#cv.dragging{cursor:grabbing}
button{font-family:var(--body);font-weight:700;color:var(--ink);border:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.t-out{text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 3px 0 var(--ink)}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0;pointer-events:none}
#hud>*{pointer-events:auto}
.hud-left{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.xpwrap{display:flex;flex-direction:column}
.logo{font-family:var(--display);font-size:clamp(26px,4.6vw,44px);line-height:1;letter-spacing:.5px;font-weight:400;
  background:linear-gradient(#fff6b0 0%,#ffd23f 45%,#f29a00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(2px 2px 0 var(--ink)) drop-shadow(-1.5px -1.5px 0 var(--ink)) drop-shadow(1.5px -1.5px 0 var(--ink)) drop-shadow(-1.5px 1.5px 0 var(--ink)) drop-shadow(0 4px 0 var(--ink))}
.right{flex-direction:column;align-items:flex-end;gap:6px}
.right .coins{margin-top:10px}
.right .wallet{margin:0}
.lvlbox{align-items:flex-start}
.lvlbox .guide{margin:12px 0 0 10px;height:30px;font-size:14px}
/* goal card */
.goal{display:flex;align-items:center;gap:9px;background:var(--cream);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:5px 10px 5px 6px;text-align:left;max-width:min(300px,calc(100vw - 32px));animation:goalin .35s cubic-bezier(.2,1.4,.5,1)}
.goal .gi{width:38px;height:38px;border-radius:10px;background:#fff;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.goal .gt{min-width:0;flex:1}
.goal .gt b{display:block;font-family:var(--display);font-weight:400;font-size:14px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal .gt .gp{height:8px;border:2px solid var(--ink);border-radius:6px;background:#5a3a1e;overflow:hidden;margin-top:4px}
.goal .gt .gp i{display:block;height:100%;background:linear-gradient(#8fe34f,#4cae1f);transition:width .3s}
.goal .gt small{font-size:11px;color:#7d5a3a;font-variant-numeric:tabular-nums}
.goal .gr{font-family:var(--display);font-size:13px;white-space:nowrap;background:var(--gold);border:2px solid var(--ink);border-radius:8px;padding:2px 7px;flex:none}
.goal.done{background:#dff5c6;border-color:var(--green-dk)}
.goal.done .gr{background:var(--green);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.goal.pop{animation:goalpop .45s ease-out}
@keyframes goalin{from{transform:translateX(-30px);opacity:0}}
@keyframes goalpop{30%{transform:scale(1.08)}}
/* welcome */
.welcome{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.welcome .mascot{font-size:84px;line-height:1;filter:drop-shadow(0 4px 0 rgba(58,36,20,.35));animation:bob 1.3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.welcome h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0;text-wrap:balance}
.welcome p{margin:0;max-width:40ch}
.steps{display:grid;gap:8px;width:100%;text-align:left;margin:4px 0 8px}
.steps div{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px 10px}
.steps .n{width:34px;height:34px;border-radius:50%;background:var(--gold);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:20px}
.steps b{font-family:var(--display);font-weight:400;display:block}
.steps small{color:#7d5a3a;font-size:13px}
/* menu */
.menu{display:grid;gap:10px}
.menu .mrow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;text-decoration:none;color:var(--ink)}
.menu .mrow .mi{font-size:26px;text-align:center}
.menu .mrow b{font-family:var(--display);font-weight:400;font-size:16px;display:block}
.menu .mrow small{color:#7d5a3a;font-size:13px}
.menu .mrow .btn{font-size:14px;padding:5px 12px}
.menu .mrow.xrow .mi svg{width:24px;height:24px}
.menu button.mrow{font-weight:500;font-family:var(--body);text-align:left;cursor:pointer}
.menu .mrow .mi{display:flex;align-items:center;justify-content:center}
/* panel pop */
.panel.enter{animation:panelin .28s cubic-bezier(.2,1.3,.5,1)}
@keyframes panelin{from{transform:translateY(24px) scale(.94);opacity:0}}
@media (max-width:640px){
  #hud{flex-wrap:wrap}
  .hud-left{order:1}
  .right{order:2}
  .title{order:3;width:100%;align-items:flex-start;flex-direction:row;gap:8px;padding-top:0;margin-top:-4px}
  .logo{font-size:22px}
  .ca{margin:0;font-size:11px;padding:1px 7px}
  .lvlbox .guide span{display:none}
  .lvlbox .guide{padding:0 8px;margin-left:6px}
  .goal{position:fixed;left:12px;bottom:calc(96px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 24px);animation:none}
  #dock{left:12px;right:12px;justify-content:space-between;gap:4px;padding:6px 6px 8px}
  .rb{width:50px;height:50px;font-size:20px}
  .rb span{font-size:10px}
  .nextup{display:block;max-width:150px;font-size:11px}
}
[hidden]{display:none!important}
.lvlbox{display:flex;align-items:center}
.star{position:relative;width:58px;height:58px;z-index:2;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.star svg{width:100%;height:100%}
.star b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-top:5px;font-family:var(--display);font-size:22px;color:#fff;font-weight:400}
.xp{margin-left:-14px;height:26px;width:clamp(110px,26vw,190px);background:#5a3a1e;border:3px solid var(--ink);border-radius:0 14px 14px 0;position:relative;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.xp i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#8fe34f,#4cae1f);transition:width .35s}
.xp span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);color:#fff;font-size:14px;letter-spacing:.5px;font-weight:400;padding-left:10px;font-variant-numeric:tabular-nums}
.right{display:flex;align-items:flex-start;gap:10px}
.xlink{margin-top:8px;width:38px;height:38px;border-radius:50%;background:#111;border:3px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;transition:transform .08s}
.xlink:hover{transform:scale(1.08)}
.xlink svg{width:18px;height:18px}
.nextup{margin:4px 0 0 -6px;font-size:12px;color:#fff;max-width:240px;line-height:1.25;text-shadow:0 1px 0 var(--ink),1px 0 0 var(--ink),-1px 0 0 var(--ink),0 -1px 0 var(--ink)}
.lvls{display:grid;gap:8px}
.lv{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 10px}
.lv.got{background:#e3f5cf}
.lv.next{background:#fff3c4;border-color:var(--gold-dk)}
.lvn{width:40px;height:40px;border-radius:50%;background:var(--gold);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:18px;font-weight:400}
.lvu{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.lvu span{background:#f7e3b5;border-radius:8px;padding:1px 7px;font-size:13px}
.tick{font-family:var(--display);color:var(--green-dk);font-size:22px}
@media (max-width:560px){.nextup{display:none}}
.ca{pointer-events:auto;margin:6px auto 0;display:flex;align-items:center;gap:6px;background:var(--cream);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:3px 10px;font-family:var(--body);font-size:13px;color:var(--ink);max-width:min(560px,calc(100vw - 32px));font-variant-numeric:tabular-nums;text-shadow:none;letter-spacing:0}
.ca b{font-family:var(--display);font-weight:400;background:var(--gold);border:2px solid var(--ink);border-radius:6px;padding:0 5px;font-size:12px}
.ca span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ca .short{display:none}
.ca i{font-style:normal;font-size:15px}
.ca:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
@media (max-width:900px){.ca .full{display:none}.ca .short{display:inline}}
.help ul{margin:0 0 10px;padding-left:20px;line-height:1.45}
.help li{margin-bottom:4px}
.help a{color:var(--red-dk);font-weight:700}
.guide{align-self:flex-start;margin:2px 0 0 10px;height:34px;display:flex;align-items:center;gap:5px;padding:0 12px 0 9px;border-radius:17px;background:var(--cream);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);text-decoration:none;color:var(--ink);font-family:var(--display);font-size:15px;font-weight:400;pointer-events:auto}
.guide:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.guestnote{display:block;margin:5px 0 0 -6px;background:#fff1c9;border:2px solid var(--ink);border-radius:10px;padding:2px 9px;font-size:12px;color:var(--ink);box-shadow:0 2px 0 var(--ink);pointer-events:auto}
.wallet{margin-top:8px;height:38px;display:flex;align-items:center;gap:6px;padding:0 14px;border-radius:19px;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);background:linear-gradient(#b48cff,#7b4fe0);color:#fff;font-family:var(--display);font-weight:400;font-size:15px;text-shadow:0 1px 0 rgba(0,0,0,.35);white-space:nowrap}
.wallet:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.wallet:disabled{opacity:.7;cursor:wait}
.wallet.on{background:var(--cream);color:var(--ink);text-shadow:none}
.wallet .dot{width:10px;height:10px;border-radius:50%;background:#3fbf3f;border:2px solid var(--ink)}
.wallet small{font-family:var(--body);font-size:11px;color:#7d5a3a}
.wallet small[data-st="error"]{color:var(--red-dk)}
.wallet .short{display:none}
.ca.soon span{color:#8a6440;font-style:italic}
.ca.soon i{display:none}
@media (max-width:640px){.guide span{display:none}.guide{padding:0 9px}.wallet .long{display:none}.wallet .short{display:inline}.wallet small{display:none}.guestnote{font-size:11px;max-width:150px;text-align:left}}
.title{display:flex;flex-direction:column;align-items:center;min-width:0;padding-top:4px;font-weight:400;line-height:1;text-align:center;padding-top:6px;pointer-events:none!important}
.title small{display:block;font-family:var(--body);font-size:11px;letter-spacing:2px;text-transform:uppercase;text-shadow:0 1px 0 var(--ink);margin-top:4px}
@media (max-width:560px){.xp{width:100px}}
.coins{display:flex;align-items:center;height:34px;background:#5a3a1e;border:3px solid var(--ink);border-radius:18px;padding:0 14px 0 4px;box-shadow:0 3px 0 rgba(0,0,0,.25);margin-top:10px}
.coin{width:34px;height:34px;margin-left:-14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8 0 18%,#ffd23f 19% 60%,#e09a00 61%);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);color:#b06d00;font-size:16px}
.coins b{font-family:var(--display);color:#fff;font-size:18px;font-weight:400;margin-left:8px;font-variant-numeric:tabular-nums}

/* side buttons */
#dock{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;gap:10px;align-items:flex-end}
.rb{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#fff7da,#f4d590);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;line-height:1;position:relative;transition:transform .08s}
.rb:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.rb span{font-family:var(--display);font-size:11px;font-weight:400;margin-top:2px;color:var(--wood-dk)}
.rb .badge{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;border-radius:12px;background:var(--red);color:#fff;border:3px solid var(--ink);font-family:var(--display);font-size:13px;font-weight:400;display:flex;align-items:center;justify-content:center;padding:0 4px}
@media (max-width:480px){.rb{width:54px;height:54px;font-size:22px}#dock{gap:6px}}

/* banner + hint */
#banner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:11;background:var(--cream);border:4px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);
  padding:6px 8px 6px 14px;display:flex;gap:10px;align-items:center;font-size:15px;max-width:calc(100% - 32px)}
#banner .big{font-size:26px}
.btn{font-family:var(--display);font-weight:400;font-size:16px;color:#fff;border-radius:12px;padding:6px 14px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);background:linear-gradient(#7fd347,#46a11c);letter-spacing:.3px;text-shadow:0 2px 0 rgba(0,0,0,.3);white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.btn.gold{background:linear-gradient(#ffd75a,#f0a400)}
.btn.red{background:linear-gradient(#ff7a5c,#d23a1c)}
.btn:disabled{background:linear-gradient(#cfc5b0,#b3a68b);cursor:not-allowed;text-shadow:none;color:#f3eee3}
#hint{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;color:#fff;font-size:13px;max-width:200px;line-height:1.3;text-shadow:0 1px 0 var(--ink),0 0 6px rgba(0,0,0,.4)}
@media (max-width:640px){#hint{display:none}}

/* bubble anchored to map */
#bubble{position:fixed;z-index:12;transform:translate(-50%,calc(-100% - 14px));background:var(--cream);border:4px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 rgba(58,36,20,.9);padding:10px 12px;min-width:160px;max-width:260px;text-align:center}
#bubble::after{content:"";position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);border:10px solid transparent;border-top:12px solid var(--ink)}
#bubble .nm{font-family:var(--display);font-size:20px;font-weight:400;line-height:1.05;display:flex;align-items:center;justify-content:center;gap:6px}
#bubble .sp{font-size:12px;color:#8a6440;text-transform:uppercase;letter-spacing:1.2px;margin:2px 0 8px}
#bubble .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#bubble .info{font-size:14px;margin-bottom:6px;font-variant-numeric:tabular-nums}
#bubble input{font-family:var(--display);font-size:18px;width:100%;border:3px solid var(--ink);border-radius:10px;padding:2px 8px;text-align:center;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
.edit{background:var(--gold);border:2px solid var(--ink);border-radius:8px;font-size:12px;padding:0 6px;height:22px}
.seed{width:58px;height:62px;border-radius:14px;background:radial-gradient(circle at 40% 30%,#fffbe8,#f2d797);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:28px;position:relative;display:flex;align-items:center;justify-content:center}
.seed small{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--ink);border-radius:8px;font-size:11px;padding:0 5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.seed:disabled{opacity:.45;cursor:not-allowed}
.bar{height:12px;border:3px solid var(--ink);border-radius:8px;background:#5a3a1e;overflow:hidden;margin:4px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(#8fe34f,#4cae1f)}

/* panels */
#shade{position:fixed;inset:0;z-index:20;background:rgba(40,24,10,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.panel{width:min(600px,100%);margin-top:30px;max-height:calc(100% - 40px);display:flex;flex-direction:column;background:var(--cream);border:5px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink);position:relative;margin-top:18px}
.ribbon{position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:linear-gradient(#c8783a,#9a5b2c);border:4px solid var(--ink);border-radius:14px;padding:4px 26px 6px;font-family:var(--display);font-weight:400;font-size:24px;color:#fff;white-space:nowrap;box-shadow:0 4px 0 var(--ink)}
.x{position:absolute;top:-16px;right:-12px;width:42px;height:42px;border-radius:50%;background:linear-gradient(#ff7a5c,#d23a1c);border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink);color:#fff;font-family:var(--display);font-size:20px;font-weight:400}
.pbody{padding:30px 16px 16px;overflow-y:auto;min-height:0}
.psub{text-align:center;font-size:14px;color:#8a6440;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 3px 0 rgba(58,36,20,.4);min-width:0}
.card.paper{background:linear-gradient(#fffdf4,#fbf0d2);transform:rotate(-.6deg)}
.card.paper:nth-child(2n){transform:rotate(.7deg)}
.card h4{margin:0;font-family:var(--display);font-weight:400;font-size:17px;line-height:1.1}
.card .note{font-size:12px;color:#8a6440;margin-top:-2px}
.need{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:10px;padding:1px 8px;font-size:14px;border:2px solid var(--ink);background:#f6cdbf;font-variant-numeric:tabular-nums}
.chip.ok{background:#c9ee9f}
.reward{display:flex;gap:10px;font-family:var(--display);font-weight:400;font-size:15px}
.card .acts{display:flex;gap:6px;align-items:center;margin-top:auto}
.card .acts .btn{flex:1;font-size:14px;padding:5px 8px}
.skip{background:none;font-size:12px;color:#8a6440;text-decoration:underline}
.waitcard{align-items:center;justify-content:center;text-align:center;color:#8a6440;min-height:150px;font-size:14px}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.slot{background:#fff;border:3px solid var(--ink);border-radius:14px;text-align:center;padding:6px 4px 4px}
.slot .ic{font-size:30px;line-height:1.1}
.slot .n{font-family:var(--display);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums}
.slot .l{font-size:11px;color:#8a6440}
.slot.zero{opacity:.45}
.sect{font-family:var(--display);font-weight:400;font-size:16px;color:var(--wood);margin:14px 0 8px}
.sect:first-child{margin-top:0}
.rec{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 10px}
.rec .ic{font-size:30px}
.rec b{font-family:var(--display);font-weight:400;font-size:16px;display:block}
.rec .in{font-size:13px;color:#8a6440}
.recs{display:grid;gap:8px}
.hopper{display:flex;gap:8px;flex-wrap:wrap}
.hslot{width:74px;height:74px;border:3px dashed #b49572;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:#8a6440;font-variant-numeric:tabular-nums;background:#fbf0d2}
.hslot.busy{border-style:solid;border-color:var(--ink);background:#fff;color:var(--ink)}
.hslot.done{border-style:solid;border-color:var(--ink);background:#c9ee9f;cursor:pointer;color:var(--ink);animation:pulse 1s ease-in-out infinite}
.hslot .ic{font-size:26px}
@keyframes pulse{50%{transform:scale(1.06)}}
.roster{display:grid;gap:6px}

<script>
(() => {
const now = () => Date.now();
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ================= GAME DATA ================= */
const CROPS = {
  wheat:  {name:"Wheat",   icon:"🌾", time:30,  lvl:1, xp:1, seed:2},
  corn:   {name:"Corn",    icon:"🌽", time:60,  lvl:1, xp:1, seed:3},
  carrot: {name:"Carrots", icon:"🥕", time:90,  lvl:2, xp:2, seed:5},
  pumpkin:{name:"Pumpkins",icon:"🎃", time:180, lvl:4, xp:3, seed:9},
  peach:  {name:"Georgia Peaches",icon:"🍑", time:240, lvl:6, xp:4, seed:14},
};
const FEEDS = {
  chickenFeed:{name:"Chicken Feed", icon:"🌰"}, barnFeed:{name:"Barnyard Hay", icon:"🌿"},
  critterMix:{name:"Critter Mix", icon:"🥬"},   sweetFeed:{name:"Sweet Feed", icon:"🍯"},
};
const GOODS = {
  egg:{name:"Eggs",icon:"🥚"}, milk:{name:"Goat Milk",icon:"🥛"}, wool:{name:"Wool",icon:"🧶"}, heart:{name:"Smiles",icon:"💛"},
  cheese:{name:"Goat Cheese",icon:"🧀"}, butter:{name:"Butter",icon:"🧈"},
  bread:{name:"Farm Bread",icon:"🍞"}, pie:{name:"Pumpkin Pie",icon:"🥧"}, cobbler:{name:"Peach Cobbler",icon:"🍮"},
  smores:{name:"S'mores",icon:"🍫"}, chili:{name:"Campfire Chili",icon:"🍲"},
};
const VALUE = {wheat:2,corn:3,carrot:5,pumpkin:9,peach:14,egg:6,milk:9,wool:12,heart:8,cheese:24,butter:34,bread:22,pie:45,cobbler:70,smores:26,chili:45};
// Production buildings. Feed Mill makes animal feed; the rest make goods for orders.
const PROD = {
  mill:   {name:"Feed Mill",  icon:"⚙️", lvl:1, slots:3, recipes:{
    chickenFeed:{in:{wheat:2,corn:1},  out:3, time:20, lvl:1, xp:2},
    barnFeed:   {in:{wheat:1,corn:2},  out:3, time:30, lvl:1, xp:2},
    critterMix: {in:{carrot:2,wheat:1},out:3, time:40, lvl:2, xp:2},
    sweetFeed:  {in:{corn:2,carrot:1}, out:2, time:40, lvl:2, xp:2}}},
  dairy:  {name:"Dairy",      icon:"🥛", lvl:5, slots:2, recipes:{
    cheese:{in:{milk:2},  out:1, time:60, lvl:5, xp:5},
    butter:{in:{milk:3},  out:1, time:90, lvl:6, xp:7}}},
  bakery: {name:"Bakery",     icon:"🍞", lvl:7, slots:2, recipes:{
    bread:  {in:{wheat:3,egg:1},              out:1, time:50,  lvl:7, xp:5},
    pie:    {in:{pumpkin:1,egg:2,wheat:1},    out:1, time:100, lvl:7, xp:9},
    cobbler:{in:{peach:2,wheat:1,butter:1},   out:1, time:120, lvl:9, xp:14}}},
  bonfire:{name:"Bonfire Pit",icon:"🔥", lvl:8, slots:2, recipes:{
    smores:{in:{wheat:2,milk:1},              out:1, time:45, lvl:8, xp:5},
    chili: {in:{corn:2,carrot:1,pumpkin:1},   out:1, time:80, lvl:9, xp:9}}},
};
const recipeOf = k => { for(const p in PROD) if(PROD[p].recipes[k]) return [p,PROD[p].recipes[k]]; return [null,null]; };
// Animal types are the ones Elsberry Riding & Farm lists for its rides and petting zoo. Names are placeholders.
const KINDS = {
  pony:    {sp:"Pony",          icon:"🐴", sprite:"🐎", feed:"barnFeed",    out:{coins:25}, time:45,  lvl:1, size:34, speed:.55, label:"Pony ride"},
  chicken: {sp:"Chicken",       icon:"🐔", sprite:"🐓", feed:"chickenFeed", out:{egg:1},    time:30,  lvl:1, size:26, speed:.7},
  goat:    {sp:"Goat",          icon:"🐐", feed:"barnFeed",    out:{milk:1},   time:60,  lvl:1, size:32, speed:.5},
  sheep:   {sp:"Sheep",         icon:"🐑", feed:"barnFeed",    out:{wool:1},   time:80,  lvl:2, size:32, speed:.4},
  rabbit:  {sp:"Rabbit",        icon:"🐇", feed:"critterMix",  out:{heart:1},  time:45,  lvl:2, size:24, speed:.8},
  puppy:   {sp:"Puppy",         icon:"🐶", sprite:"🐕", feed:"critterMix",  out:{heart:1},  time:30,  lvl:2, size:26, speed:.9},
  horse:   {sp:"Trail Horse",   icon:"🐎", feed:"sweetFeed",   out:{coins:50}, time:90,  lvl:3, size:42, speed:.6, label:"1-hr trail ride, $50"},
  calf:    {sp:"Baby Cow",      icon:"🐮", sprite:"🐄", feed:"barnFeed",    out:{heart:2},  time:70,  lvl:3, size:32, speed:.4},
  donkey:  {sp:"Donkey",        icon:"🫏", feed:"barnFeed", out:{heart:2}, time:70, lvl:1, size:36, speed:.45},
  duckling:{sp:"Duckling",      icon:"🐥", feed:"chickenFeed", out:{heart:1},  time:40,  lvl:4, size:22, speed:.7},
  piglet:  {sp:"Baby Pig",      icon:"🐷", sprite:"🐖", feed:"critterMix",  out:{heart:2},  time:60,  lvl:4, size:28, speed:.55},
  tortoise:{sp:"Giant Tortoise",icon:"🐢", feed:"critterMix",  out:{heart:4},  time:150, lvl:5, size:34, speed:.15},
};
// [kind, placeholder name, level it joins the farm]
const ANIMALS = [
  ["horse","Dusty",3],["horse","Biscuit",3],
  ["pony","Pony #1",1],["pony","Pony #2",1],["pony","Pony #3",1],
  ["chicken","Henrietta",1],["chicken","Pecky",1],
  ["goat","Goat #1",1],["goat","Goat #2",1],
  ["sheep","Sheep #1",2],
  ["calf","Baby Cow",3],["donkey","HeeHaw",1],
  ["rabbit","Bunny #1",2],["duckling","Duckling #1",4],["puppy","Puppy #1",2],
  ["piglet","Piglet #1",4],["tortoise","Tortoise",5],
  ["horse","Trail Horse #3",6],["horse","Trail Horse #4",8],["pony","Pony #4",6],
  ["chicken","Hen #3",5],["chicken","Hen #4",7],["goat","Goat #3",6],["sheep","Sheep #2",7],
  ["rabbit","Bunny #2",6],["puppy","Puppy #2",8],["piglet","Piglet #2",8],["duckling","Duckling #2",7],
  ["tortoise","Tortoise #2",10],["calf","Baby Cow #2",9],["donkey","HeeHaw Jr.",9],
];
const alvl = a => Math.max(KINDS[a.kind].lvl, (ANIMALS[a.id]||[])[2]||1);
const CUSTOMERS = [
  ["Birthday party","Petting zoo + pony rides, 2 hours"],
  ["Date Night couple","Trail ride, farm-to-table supper, bonfire"],
  ["Horse camp kids","Snacks for the camp cabin"],
  ["Neighbor on Grady Rd","Trading for a few groceries"],
  ["Ride & Dine gift","Christmas gift certificate basket"],
  ["Mobile petting zoo","Packing the trailer for a backyard party"],
  ["Trail ride group","Six riders and a cooler"],
  ["Pony painting class","Unlimited kids, one patient pony"],
];

/* ================= MAP LAYOUT (tile coords) ================= */
const MAP = 56, TW = 72, TH = 36;
// Land that opens as you level. The far regions are previews of what's coming later.
const ZONES = [
  {id:"east",    name:"East Meadow",     x:24,y:0, w:10,h:16, lvl:5,  icon:"🥛", tease:"Dairy"},
  {id:"south",   name:"South Fields",    x:0, y:24,w:24,h:10, lvl:6,  icon:"🍑", tease:"18 plots · peaches"},
  {id:"trail",   name:"Trailhead",       x:24,y:16,w:10,h:18, lvl:8,  icon:"🔥", tease:"Bonfire Pit"},
  {id:"orchard", name:"Peach Orchard",   x:34,y:0, w:22,h:18, lvl:12, icon:"🌳", tease:"Fruit trees"},
  {id:"mountain",name:"Mountain Trail",  x:34,y:18,w:22,h:20, lvl:15, icon:"⛰️", tease:"360° mountain view ride"},
  {id:"rodeo",   name:"Rodeo Arena",     x:0, y:34,w:18,h:22, lvl:18, icon:"🤠", tease:"Barrel races"},
  {id:"river",   name:"Riverbend",       x:18,y:34,w:16,h:22, lvl:20, icon:"🎣", tease:"Fishing dock"},
  {id:"market",  name:"Grady Rd Market", x:34,y:38,w:22,h:18, lvl:25, icon:"🏪", tease:"Farm stand"},
];
const zoneAt = (x,y) => ZONES.find(z=>x>=z.x&&x<z.x+z.w&&y>=z.y&&y<z.y+z.h);
const zoneOpen = z => !z || S.lvl>=z.lvl;
const BLOCKS = [{x:2,y:4,cols:6,n:36},{x:2,y:25,cols:6,n:36}];
// Plots open for free as you level: 18 at Lv1, +6 at Lv2, Lv3, Lv4, +18 at Lv6 and Lv8.
const PLOT_LVL = [...Array(18).fill(1),...Array(6).fill(2),...Array(6).fill(3),...Array(6).fill(4),...Array(18).fill(6),...Array(18).fill(8)];
const NPLOTS = PLOT_LVL.length;
function plotXY(i){ const b = i<36? BLOCKS[0] : BLOCKS[1]; const j = i<36? i : i-36; return [b.x + j%b.cols, b.y + Math.floor(j/b.cols)]; }
const owned = i => PLOT_LVL[i] <= S.lvl;
const PENS = [
  {id:"coop",    name:"Coop",          x:15,y:1, w:4,h:3, ground:"#e8cf7a", ground2:"#dcc06a", kinds:["chicken","duckling"]},
  {id:"pasture", name:"Pasture",       x:15,y:5, w:6,h:4, ground:"#a6db5a", ground2:"#9bd24f", kinds:["goat","sheep","calf"]},
  {id:"heehaw",  name:"HeeHaw Pen",    x:17,y:11,w:5,h:4, ground:"#f0d27a", ground2:"#e6c66b", kinds:["donkey"], mascot:true},
  {id:"paddock", name:"Riding Paddock",x:2, y:12,w:6,h:6, ground:"#d9ab72", ground2:"#cf9f64", kinds:["horse","pony"]},
  {id:"zoo",     name:"Petting Zoo",   x:10,y:12,w:6,h:5, ground:"#bfe58a", ground2:"#b3dc7c", kinds:["rabbit","puppy","piglet","tortoise"]},
];
const BUILD = {
  barn:   {x:10,y:1,w:3,d:3},
  silo:   {x:13,y:0,w:1,d:1},
  mill:   {x:10,y:6,w:2,d:2},
  house:  {x:2, y:0,w:3,d:3},
  board:  {x:13,y:9,w:1,d:1},
  dairy:  {x:26,y:3,w:3,d:2},
  bakery: {x:14,y:26,w:3,d:2},
  bonfire:{x:27,y:22,w:2,d:2},
};
const BASE_TREES = [[6,1],[0,0],[1,0],[0,2],[0,8],[1,10],[0,14],[0,18],[1,21],[4,22],[7,21],[11,22],[14,21],[21,21],[23,19],[23,14],[23,12],[23,6],[22,2],[20,0],[7,0],[9,19],[5,20],[20,22],[12,19]];
function pathTile(x,y){
  if((y===10 && x<=23) || (x===8 && y<=23) || (y===20 && x>=8 && x<=23)) return true;
  if(S.lvl>=5 && ((y===10 && x>=24) || (x===27 && y>=5 && y<=9))) return true;
  if(S.lvl>=6 && ((x===8 && y>=24 && y<=29) || (y===29 && x>=8 && x<=15))) return true;
  if(S.lvl>=8 && ((y===20 && x>=24 && x<=28) || (x===28 && y>=20 && y<=21) || (x===29 && y>=24 && y<=33))) return true;
  return false;
}
const inPond = (x,y) => { const dx=(x+.5-21)/2.6, dy=(y+.5-17.5)/2.0; return dx*dx+dy*dy<1; };
function reserved(x,y){
  if(pathTile(x,y)) return true;
  for(const k in BUILD){ const b=BUILD[k]; if(x>=b.x-1&&x<=b.x+b.w&&y>=b.y-1&&y<=b.y+b.d) return true; }
  const b=BLOCKS[1]; if(x>=b.x-1&&x<=b.x+b.cols&&y>=b.y-1&&y<=b.y+6) return true;
  if(x>=24&&x<=31&&y>=17&&y<=27) return true; // trailhead clearing
  return false;
}

/* ================= STATE ================= */
const KEY = "elsberry-farm-v1";
function fresh(){
  return { coins:60, xp:0, lvl:1, plotsOwned:6, lastCrop:{},
    inv:{wheat:14,corn:10,chickenFeed:3,barnFeed:3},
    plots:Array(NPLOTS).fill(null), prod:{mill:[],dairy:[],bakery:[],bonfire:[]},
    animals:ANIMALS.map(([k,n],i)=>({id:i,kind:k,name:n,start:null})), orders:[] };
}
// Bring any saved farm (older versions included) up to the current shape.
function normalize(st){
  if(!st || typeof st!=="object" || !st.inv || !Array.isArray(st.animals) || typeof st.lvl!=="number") return fresh();
  delete st.savedAt;
  if(!st.prod) st.prod={mill:st.mill||[],dairy:[],bakery:[],bonfire:[]}; delete st.mill;
  for(const p in PROD) if(!Array.isArray(st.prod[p])) st.prod[p]=[];
  if(!Array.isArray(st.plots)) st.plots=[];
  while(st.plots.length<NPLOTS) st.plots.push(null);
  for(let i=st.animals.length;i<ANIMALS.length;i++) st.animals.push({id:i,kind:ANIMALS[i][0],name:ANIMALS[i][1],start:null});
  if(st.animals[11]&&st.animals[11].name==="Baby Donkey") st.animals[11].name="HeeHaw";
  if(st.animals[30]&&st.animals[30].name==="Baby Donkey #2") st.animals[30].name="HeeHaw Jr.";
  if(!Array.isArray(st.orders)) st.orders=[]; if(!st.lastCrop) st.lastCrop={};
  return st;
}
let S; try{ S = JSON.parse(localStorage.getItem(KEY)); }catch(e){ S = null; }
S = normalize(S);
// ?brand renders a staged showcase farm (used by the logo/banner page); it never touches the player's save.
const SHOWCASE = /[?&]brand\b/.test(location.search);
if(SHOWCASE){
  const t=Date.now(), long=1e7, crops=["wheat","corn","carrot","pumpkin","peach"];
  S=fresh(); S.lvl=9; S.coins=4820; S.xp=640;
  S.plots=S.plots.map((_,i)=>({crop:crops[(i*7+Math.floor(i/6))%5], start: i%4===3 ? t-5000 : t-long}));
  S.animals.forEach((a,i)=>{ a.start = i%3===1 ? null : t-long; });
  S.prod.mill=[{k:"barnFeed",end:t-1000}];
  if(!/[?&]hud\b/.test(location.search)) document.documentElement.classList.add("brand");
}
/* ---------- saving ----------
   On the live site, progress saves to the server under the player's Solana wallet.
   Guests can play, but nothing is kept until they connect. Where there's no server
   (e.g. a static preview), the game falls back to saving in this browser. */
const SESSION_KEY="heehawday-session";
const NET={mode:"pending", wallet:null, token:null, dirty:false, t:0};
const save = () => {
  if(SHOWCASE) return;
  if(NET.mode==="local"){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} return; }
  if(NET.mode==="wallet"){ NET.dirty=true; clearTimeout(NET.t); NET.t=setTimeout(flushSave,2500); setSaveState("pending"); }
};

const need = l => 15*l*l;
const fmt = s => { s=Math.max(0,Math.ceil(s)); const m=Math.floor(s/60); return m? `${m}m ${String(s%60).padStart(2,"0")}s` : `${s}s`; };
const iconOf = k => (CROPS[k]||FEEDS[k]||GOODS[k]||{}).icon || "🪙";
const nameOf = k => (CROPS[k]||FEEDS[k]||GOODS[k]||{}).name || k;
const have = k => S.inv[k]||0;
const animalReady = a => a.start!==null && (now()-a.start)/1000 >= KINDS[a.kind].time;
const plotReady = p => p && (now()-p.start)/1000 >= CROPS[p.crop].time;

/* ---------- what each level unlocks ---------- */
function unlocksAt(L){
  const out=[];
  for(const z of ZONES) if(z.lvl===L) out.push(`🗺️ New land: ${z.name}`);
  for(const p in PROD) if(PROD[p].lvl===L && L>1) out.push(`${PROD[p].icon} ${PROD[p].name}`);
  for(const k in CROPS) if(CROPS[k].lvl===L && L>1) out.push(`${CROPS[k].icon} ${CROPS[k].name}`);
  for(const p in PROD) for(const r in PROD[p].recipes){ const R=PROD[p].recipes[r]; if(R.lvl===L && L>1) out.push(`${iconOf(r)} ${nameOf(r)}`); }
  const ani={}; S.animals.forEach(a=>{ if(alvl(a)===L){ const sp=KINDS[a.kind].sp; ani[sp]=(ani[sp]||0)+1; } });
  for(const sp in ani){ const k=Object.keys(KINDS).find(x=>KINDS[x].sp===sp); out.push(`${KINDS[k].icon} ${ani[sp]>1? ani[sp]+" ":""}${sp}${ani[sp]>1?"s":""}`); }
  const plots=PLOT_LVL.filter(l=>l===L).length; if(plots && L>1) out.push(`🟫 ${plots} more field plots`);
  return out;
}

/* ================= CANVAS ================= */
const cv = $("#cv"), ctx = cv.getContext("2d");
let W=0, H=0, DPR=1;
const cam = {x:0,y:0,z:1};
const iso = (x,y) => [(x-y)*TW/2, (x+y)*TH/2];
function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; }
function centerOn(tx,ty){ const [X,Y]=iso(tx,ty); cam.x=W/2-X*cam.z; cam.y=H/2-Y*cam.z; }
function clampCam(){
  const minX=-MAP*TW/2, maxX=MAP*TW/2, minY=-60, maxY=MAP*TH;

  drawGround(); cloudShadows();
  const items=[];
  for(let i=0;i<NPLOTS;i++){ const [x,y]=plotXY(i); if(zoneOpen(zoneAt(x,y))) items.push([x+y+1,()=>drawCrop(i)]); }
  const tv=(x,y)=>{ const [X,Y]=iso(x+.5,y+.5); return inView(X,Y); };
  for(const [x,y] of BASE_TREES) if(tv(x,y)) items.push([x+y+1.2,()=>drawTree(x,y,false)]);
  for(const [x,y,d] of zoneTrees()) if(tv(x,y)) items.push([x+y+1.2,()=>drawTree(x,y,d)]);
  const B=BUILD, k=b=>b.x+b.w+b.y+b.d-.5;
  items.push([GIFT.x+GIFT.y+1,drawGift]);
  items.push([k(B.barn),drawBarn],[B.silo.x+B.silo.y+1.4,drawSilo],[k(B.mill),drawMill],[k(B.house)+.2,drawHouse],[B.board.x+B.board.y+1.1,drawBoard]);
  if(zoneOpen(ZONES[0])) items.push([k(B.dairy),drawDairy]);
  if(zoneOpen(ZONES[1])) items.push([k(B.bakery),drawBakery]);
  if(zoneOpen(ZONES[2])) items.push([k(B.bonfire)+1,drawBonfire]);
  for(const z of ZONES) if(!zoneOpen(z)) items.push([z.x+z.w/2+z.y+z.h/2+.6,()=>drawZoneSign(z)]);
  for(const pen of PENS){
    for(const [p,q] of fenceSegments(pen)){ const kk=(p[0]+q[0])/2+(p[1]+q[1])/2; items.push([kk+.02,()=>drawFenceSeg(iso(...p),iso(...q))]); }
    const locked=S.animals.filter(a=>pen.kinds.includes(a.kind) && alvl(a)>S.lvl);
    const [sx,sy]=iso(pen.x+pen.w/2,pen.y+pen.h);
    if(pen.mascot){ const gx=pen.x+Math.floor(pen.w/2), gy=pen.y+pen.h; items.push([gx+gy+.6,()=>drawArch(iso(gx,gy),iso(gx+1,gy))]);
      const [hx,hy]=iso(pen.x+.8,pen.y+.8); items.push([pen.x+pen.y+1.6,()=>drawHay(hx,hy)]); }
    items.push([pen.x+pen.y+pen.w+pen.h+.5,()=>{ if(pen.mascot) label("Home of the farm mascot",sx,sy+16,11,"#ffe066"); else label(pen.name.toUpperCase(),sx,sy+16,12);
      if(locked.length) label(`More animals at Lv ${Math.min(...locked.map(alvl))}`,sx,sy+31,10,"#ffe066"); }]);
  }
  for(const a of S.animals){ if(alvl(a)>S.lvl) continue; const r=rt(a); items.push([r.x+r.y,()=>drawAnimal(a)]); }
  items.sort((a,b)=>a[0]-b[0]); for(const [,f] of items) f();
  drawParts();
  for(const f of OVER) f();
}

/* ================= UI HELPERS ================= */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols=["#ffc531","#e04a2f","#5cb82e","#4fb4e0","#fff"];
  for(let k=0;k<70;k++){ const c=document.createElement("i"); c.className="confetti"; c.style.left=Math.random()*100+"vw"; c.style.background=cols[k%cols.length];
    document.body.appendChild(c);
    const a=c.animate([{transform:`translate(0,-20px) rotate(0deg)`},{transform:`translate(${(Math.random()-.5)*160}px,${innerHeight+40}px) rotate(${Math.random()*900}deg)`}],{duration:1600+Math.random()*1400,delay:Math.random()*400,easing:"cubic-bezier(.2,.6,.4,1)"});
    a.onfinish=()=>c.remove(); }
}
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.style.opacity=0,1700); setTimeout(()=>t.remove(),2100); }
function floatScreen(sx,sy,txt){ const f=document.createElement("div"); f.className="float t-out"; f.textContent=txt; f.style.left=sx+"px"; f.style.top=sy+"px"; document.body.appendChild(f); setTimeout(()=>f.remove(),1100); }
/* Icons fly from where you tapped into the HUD, which bumps when they land. */
function flyTo(sx,sy,icon,target,delay=0){
  const el=typeof target==="string"? $(target) : target; if(!el||sx==null) return;
  const r=el.getBoundingClientRect(), tx=r.left+r.width/2, ty=r.top+r.height/2;
  const f=document.createElement("div"); f.className="fly"; f.textContent=icon; f.style.left=sx+"px"; f.style.top=sy+"px"; document.body.appendChild(f);
  const dx=tx-sx, dy=ty-sy, lift=-Math.min(140,Math.abs(dx)*.35+60);
  const a=f.animate([{transform:"translate(-50%,-50%) scale(.6)",opacity:0},{transform:`translate(calc(-50% + ${dx*.15}px),calc(-50% + ${lift}px)) scale(1.25)`,opacity:1,offset:.25},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.7)`,opacity:1}],{duration:720,delay,easing:"cubic-bezier(.45,0,.4,1)",fill:"both"});
  a.onfinish=()=>{ f.remove(); el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); };
}
function gain(xp,coins,sx,sy){
  S.coins+=coins||0; S.xp+=xp||0;
  const parts=[]; if(coins) parts.push(`+${coins} 🪙`); if(xp) parts.push(`+${xp} ⭐`);
  if(parts.length && sx!=null){ floatScreen(sx,sy,parts.join("  "));
    if(coins) for(let k=0;k<Math.min(5,Math.ceil(coins/15));k++) flyTo(sx,sy,"🪙",".coins",k*70);
    if(xp) flyTo(sx,sy,"⭐",".star",120); }
  while(S.xp>=need(S.lvl)){ S.xp-=need(S.lvl); S.lvl++; openPanel("level",unlocksAt(S.lvl)); confetti(); }
}
let bub=null, bubLive=null;
function openBubble(wx,wy,html,bind){ bub={wx,wy}; bubLive=null; const b=$("#bubble"); b.innerHTML=html; b.hidden=false; bind&&bind(b); placeBubble(); }
function closeBubble(){ bub=null; bubLive=null; $("#bubble").hidden=true; }
function placeBubble(){ if(!bub) return; if(bub.place) return bub.place(); const [sx,sy]=toScreen(bub.wx,bub.wy); const b=$("#bubble"); const w=b.offsetWidth;
  b.style.left=Math.max(w/2+8,Math.min(W-w/2-8,sx))+"px"; b.style.top=Math.max(b.offsetHeight+24,sy)+"px"; }

let plantMode=null;
function seedBubble(i){
  const [x,y]=plotXY(i); const [wx,wy]=iso(x+.5,y+.3);
  let html=`<div class="sp" style="margin-top:0">Plant a crop</div><div class="row">`;
  for(const k in CROPS){ const c=CROPS[k]; if(c.lvl>S.lvl) continue;
    html+=`<button class="seed" data-k="${k}" ${have(k)<=0&&S.coins<c.seed?"disabled":""} aria-label="Plant ${c.name}">${c.icon}<small>${have(k)>0? "×"+have(k) : c.seed+"🪙"}</small></button>`; }
  openBubble(wx,wy,html+`</div>`,b=>b.querySelectorAll(".seed").forEach(btn=>btn.onclick=()=>{ plantMode=btn.dataset.k; plant(i); closeBubble(); showBanner(); }));
}
function plant(i){
  if(!owned(i) || S.plots[i]) return false; const k=plantMode, c=CROPS[k];
  if(have(k)>0) S.inv[k]--; else if(S.coins>=c.seed) S.coins-=c.seed; else { toast(`Out of ${c.name.toLowerCase()} and coins for seed.`); plantMode=null; showBanner(); return false; }
  S.plots[i]={crop:k,start:now()}; S.lastCrop[i]=k; progressGoal("plant"); save(); return true;
}
function harvest(i,sx,sy){
  const p=S.plots[i]; if(!plotReady(p)) return false; const c=CROPS[p.crop];
  S.inv[p.crop]=have(p.crop)+2; S.plots[i]=null; gain(c.xp,0); progressGoal("harvest");
  const [x,y]=plotXY(i); sparkle(...iso(x+.5,y+.5),8,["#ffe066","#9be35a","#fff"]);
  if(sx!=null){ floatScreen(sx,sy,`+2 ${c.icon}`); flyTo(sx,sy,c.icon,'[data-open="barn"]'); flyTo(sx,sy,c.icon,'[data-open="barn"]',90); flyTo(sx,sy,"⭐",".star",160); }
  save(); return true;
}
function showBanner(){
  const b=$("#banner"); if(!plantMode){ b.hidden=true; return; }
  const c=CROPS[plantMode];
  b.innerHTML=`<span class="big">${c.icon}</span><span>Planting ${c.name.toLowerCase()} (${have(plantMode)} left). Tap or drag across empty plots.</span><button class="btn" id="doneP">Done</button>`;
  b.hidden=false; $("#doneP").onclick=()=>{ plantMode=null; showBanner(); };
}
function feed(a){ const K=KINDS[a.kind]; if(have(K.feed)<=0) return false; S.inv[K.feed]--; a.start=now();
  if(a.kind==="donkey") progressGoal("feedDonkey"); if(a.kind==="pony"||a.kind==="horse") progressGoal("ride"); save(); return true; }
function collect(a,sx,sy){ const K=KINDS[a.kind]; if(!animalReady(a)) return false; let coins=0;
  for(const [k,v] of Object.entries(K.out)){ if(k==="coins") coins+=v; else S.inv[k]=have(k)+v; }
  if(!coins){ floatScreen(sx,sy-24,Object.entries(K.out).map(([k,v])=>`+${v} ${iconOf(k)}`).join(" "));
    for(const [k] of Object.entries(K.out)) flyTo(sx,sy,iconOf(k),'[data-open="barn"]'); }
  const r=rt(a); sparkle(...iso(r.x,r.y),10,["#ffe066","#ff9fb4","#fff"],-24);
  a.start=null; gain(3,coins,sx,sy); progressGoal("collect"); save(); return true; }
function animalBubble(a){
  const K=KINDS[a.kind], r=rt(a); const [wx,wy]=iso(r.x,r.y);
  const render=()=>{
    let act="";
    if(a.start===null){ const h=have(K.feed); act=`<div class="info">${K.label? K.label+"<br>":""}Eats ${FEEDS[K.feed].icon} ${FEEDS[K.feed].name} (you have ${h})</div><button class="btn" data-a="feed" ${h?"":"disabled"}>Feed</button>${h?"":`<div class="info" style="margin-top:6px">Make more at the Feed Mill.</div>`}`; }
    else if(animalReady(a)) act=`<button class="btn gold" data-a="col">Collect</button>`;
    else { const el=(now()-a.start)/1000; act=`<div class="bar"><i style="width:${el/K.time*100}%"></i></div><div class="info">${K.label?"Out on a ride · ":""}${fmt(K.time-el)} left</div>`; }
    return `<div class="nm"><span>${esc(a.name)}</span><button class="edit" data-a="ren" aria-label="Rename">✎</button></div><div class="sp">${K.sp}</div>${act}`;
  };
  const bind=b=>b.querySelectorAll("[data-a]").forEach(btn=>btn.onclick=()=>{
    const act=btn.dataset.a;
    if(act==="feed"){ feed(a); refresh(); }
    if(act==="col"){ const rc=btn.getBoundingClientRect(); collect(a,rc.left+rc.width/2,rc.top); refresh(); }
    if(act==="ren"){ bubLive=null; b.innerHTML=`<input id="renIn" maxlength="18" value="${esc(a.name)}" aria-label="New name"><div class="row" style="margin-top:8px"><button class="btn" id="renOk">Save</button></div>`;
      const i=$("#renIn"); i.focus(); i.select(); const ok=()=>{ const v=i.value.trim(); if(v) a.name=v; save(); refresh(); };
      $("#renOk").onclick=ok; i.onkeydown=e=>{ if(e.key==="Enter") ok(); if(e.key==="Escape") refresh(); }; }
  });
  const refresh=()=>{ if(!bub) return; const b=$("#bubble"); b.innerHTML=render(); bind(b); bubLive=refresh; placeBubble(); };
  openBubble(wx,wy-K.size-4,render(),bind); bubLive=refresh;
}

/* ---------- orders ---------- */
function availableGoods(){
  const out=[]; for(const k in CROPS) if(CROPS[k].lvl<=S.lvl) out.push(k);
  for(const a of S.animals) if(alvl(a)<=S.lvl) for(const g of Object.keys(KINDS[a.kind].out)) if(g!=="coins"&&!out.includes(g)) out.push(g);
  for(const p in PROD){ if(p==="mill"||PROD[p].lvl>S.lvl) continue; for(const r in PROD[p].recipes) if(PROD[p].recipes[r].lvl<=S.lvl) out.push(r); }
  return out;
}
function newOrder(){
  const pool=availableGoods().sort(()=>Math.random()-.5);
  const lines=Math.min(pool.length,1+Math.floor(Math.random()*Math.min(3,1+S.lvl/2)));
  const items={}; let val=0;
  for(let i=0;i<lines;i++){ const k=pool[i]; const big=VALUE[k]>=20; const q=1+Math.floor(Math.random()*(big?2:2+Math.min(3,S.lvl))); items[k]=q; val+=VALUE[k]*q; }
  const c=CUSTOMERS[Math.floor(Math.random()*CUSTOMERS.length)];
  return {who:c[0],note:c[1],items,coins:Math.round(val*1.4+5),xp:Math.max(2,Math.round(val/4)),wait:0};
}
function readyOrders(){ return S.orders.filter(o=>!o.wait&&Object.entries(o.items).every(([k,q])=>have(k)>=q)).length; }

  if(k==="roster"){

      return `<div class="lv ${st}"><div class="lvn">${L}</div><div class="lvu">${u.map(x=>`<span>${x}</span>`).join("")}</div>${L<=S.lvl?'<div class="tick">✓</div>':""}</div>`; }).join("")+`</div>`;

    body=`<div class="help"><p class="psub">Your farm saves to your Solana wallet. Signing in is free and never sends a transaction.</p>
      <div class="sect">On a phone</div><p>Open HeeHawDay inside your wallet app's browser:</p>
      <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><a class="btn" href="https://phantom.app/ul/browse/${here}?ref=${ref}">Open in Phantom</a><a class="btn gold" href="https://solflare.com/ul/v1/browse/${here}?ref=${ref}">Open in Solflare</a></div>
      <div class="sect">On a computer</div><p>Install a Solana wallet extension, then reload this page and press Connect wallet.</p>
      <ul><li><a href="https://phantom.app/download" target="_blank" rel="noopener">Phantom</a></li><li><a href="https://solflare.com/download" target="_blank" rel="noopener">Solflare</a></li><li><a href="https://backpack.app/download" target="_blank" rel="noopener">Backpack</a></li></ul></div>`;
  }
  if(k==="level"){
    title="Level Up!";
    body=`<div class="lvlup"><div class="big t-out">${S.lvl}</div><p>${panel.arg.length? "New on the farm:" : "Word about your farm is spreading down Grady Rd."}</p><div class="lvu" style="justify-content:center;margin-bottom:10px">${panel.arg.map(x=>`<span>${x}</span>`).join("")}</div><button class="btn gold" id="lvOk">Yeehaw!</button></div>`;
  }
  // Live refreshes only swap the contents; the window itself (and its pop-in) is built once per open.
  const key=k+"|"+(panel.arg&&typeof panel.arg==="string"?panel.arg:"");
  const pb=sh.querySelector(".pbody");
  if(!sh.hidden && pb && sh.dataset.key===key){
    const keep=pb.scrollTop; pb.innerHTML=body; pb.scrollTop=keep;
  } else {
  sh.dataset.key=key;
  sh.innerHTML=`<div class="panel enter" role="dialog" aria-label="${title}"><div class="ribbon t-out">${title}</div><button class="x" aria-label="Close">✕</button><div class="pbody">${body}</div></div>`;
  sh.hidden=false;
  }
  sh.querySelector(".x").onclick=closePanel;
  sh.onclick=e=>{ if(e.target===sh) closePanel(); };
  sh.querySelectorAll("[data-make]").forEach(b=>b.onclick=()=>{ const id=panel.arg, R=PROD[id].recipes[b.dataset.make], q=S.prod[id];
    for(const [i,n] of Object.entries(R.in)) S.inv[i]-=n;
    const last=q.length? q[q.length-1].end : now(); q.push({k:b.dataset.make,end:Math.max(now(),last)+R.time*1000}); save(); renderPanel(); });
  sh.querySelectorAll("[data-take]").forEach(b=>b.onclick=()=>{ const id=panel.arg, i=+b.dataset.take, j=S.prod[id][i], R=PROD[id].recipes[j.k];
    S.inv[j.k]=have(j.k)+R.out; S.prod[id].splice(i,1);
    const r=b.getBoundingClientRect(); floatScreen(r.left+r.width/2,r.top,`+${R.out} ${iconOf(j.k)}`); gain(R.xp,0); progressGoal("make"); save(); renderPanel(); });
  sh.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.del, o=S.orders[i]; for(const [x,q] of Object.entries(o.items)) S.inv[x]-=q;
    const r=b.getBoundingClientRect(); S.orders[i]={wait:now()+8000}; gain(o.xp,o.coins,r.left+r.width/2,r.top); progressGoal("deliver"); save(); renderPanel(); });
  sh.querySelectorAll("[data-skip]").forEach(b=>b.onclick=()=>{ S.orders[+b.dataset.skip]={wait:now()+15000}; save(); renderPanel(); });
  sh.querySelectorAll(".ra input").forEach(inp=>{ inp.onchange=()=>{ const a=S.animals.find(x=>x.id==inp.dataset.id); const v=inp.value.trim(); if(v){ a.name=v; save(); } else inp.value=a.name; };
    inp.onkeydown=e=>{ if(e.key==="Enter") inp.blur(); }; });
  const rb=$("#resetBtn"); if(rb) rb.onclick=()=>{ if(rb.dataset.armed){ S=fresh(); for(const x in RT) delete RT[x]; zoneTreeLvl=-1; save(); closePanel(); renderGoal(); toast("Fresh farm, fresh start."); return; }
    rb.dataset.armed=1; rb.textContent="Tap again to erase this farm"; };
  const lo=$("#lvOk"); if(lo) lo.onclick=closePanel;
  const wg=$("#wGo"); if(wg) wg.onclick=()=>{ closePanel(); try{ localStorage.setItem("heehawday-welcomed","1"); }catch(e){} };
  const mc=$("#mConn"); if(mc) mc.onclick=()=>{ closePanel(); connectWallet(); };
  const md=$("#mDisc"); if(md) md.onclick=async()=>{ await flushSave(); try{ const p=walletProvider(); p&&p.disconnect&&p.disconnect(); }catch(e){} sessionEnded(); loadState(fresh()); closePanel(); toast("Disconnected. You're playing as a guest now, so progress won't save."); };
  sh.querySelectorAll("[data-open2]").forEach(b=>b.onclick=()=>openPanel(b.dataset.open2));
}
document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{ const v=b.dataset.open; if(v==="mill") openPanel("prod","mill"); else openPanel(v); });

/* ================= INPUT ================= */
const ptrs=new Map(); let drag=null, pinch=null;
function plotAt(sx,sy){ const [tx,ty]=toTile(sx,sy); const x=Math.floor(tx), y=Math.floor(ty);
  for(let bi=0;bi<2;bi++){ const b=BLOCKS[bi]; const rows=b.n/b.cols;
    if(x>=b.x&&x<b.x+b.cols&&y>=b.y&&y<b.y+rows){ const i=bi*36+(y-b.y)*b.cols+(x-b.x); return zoneOpen(zoneAt(x,y))? i : -1; } }
  return -1; }
function hitAt(sx,sy){ const [wx,wy]=toWorld(sx,sy);
  for(let k=HIT.length-1;k>=0;k--){ const h=HIT[k]; if(h.kind==="animal"&&wx>=h.x0&&wx<=h.x1&&wy>=h.y0&&wy<=h.y1) return h; }
  for(let k=HIT.length-1;k>=0;k--){ const h=HIT[k]; if(h.kind!=="animal"&&wx>=h.x0&&wx<=h.x1&&wy>=h.y0&&wy<=h.y1) return h; }
  return null; }
cv.addEventListener("pointerdown",e=>{
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:cam.z}; drag=null; return; }
  const i=plotAt(e.clientX,e.clientY); let tool=null;
  if(i>=0 && owned(i)){
    if(plantMode && !S.plots[i]){ tool="plant"; plant(i); showBanner(); }
    else if(plotReady(S.plots[i])){ tool="sickle"; harvest(i,e.clientX,e.clientY-20); }
  }
  drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,moved:false,tool};
});
cv.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(pinch&&ptrs.size===2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]); zoomAt((a[0]+b[0])/2,(a[1]+b[1])/2,pinch.z*d/pinch.d/cam.z); return; }
  if(!drag) return;
  if(drag.tool){ const i=plotAt(e.clientX,e.clientY); if(i>=0&&owned(i)){
      if(drag.tool==="plant"&&!S.plots[i]&&plantMode){ plant(i); showBanner(); }
      if(drag.tool==="sickle"&&plotReady(S.plots[i])) harvest(i,e.clientX,e.clientY-20); }
    return; }
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!drag.moved && Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6){ drag.moved=true; cv.classList.add("dragging"); }
  if(drag.moved){ cam.x+=dx; cam.y+=dy; clampCam(); }
  drag.x=e.clientX; drag.y=e.clientY;
});
function endPtr(e){
  ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null;
  if(drag&&!drag.moved&&!drag.tool&&ptrs.size===0) tap(e.clientX,e.clientY);
  if(ptrs.size===0){ drag=null; cv.classList.remove("dragging"); }
}
cv.addEventListener("pointerup",endPtr);
cv.addEventListener("pointercancel",e=>{ ptrs.delete(e.pointerId); drag=null; pinch=null; cv.classList.remove("dragging"); });
function zoomAt(sx,sy,f){ const z=Math.max(.22,Math.min(1.9,cam.z*f)); cam.x=sx-(sx-cam.x)*z/cam.z; cam.y=sy-(sy-cam.y)*z/cam.z; cam.z=z; clampCam(); }
cv.addEventListener("wheel",e=>{ e.preventDefault(); zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.0015)); },{passive:false});

function tap(sx,sy){
  const h=hitAt(sx,sy);
  if(h&&h.kind==="animal"){ const a=S.animals.find(x=>x.id===h.ref); rt(a).squash=now(); sparkle(...iso(rt(a).x,rt(a).y),5,["#fff","#ffe066"],-30);
    if(animalReady(a)){ collect(a,sx,sy-20); closeBubble(); return; }
    if(a.start===null&&feed(a)){ floatScreen(sx,sy-30,`-1 ${FEEDS[KINDS[a.kind].feed].icon}`); closeBubble(); return; }
    animalBubble(a); return; }
  const i=plotAt(sx,sy);
  if(i>=0){
    const [x,y]=plotXY(i);
    if(owned(i)){ const p=S.plots[i];
      if(!p){ if(plantMode){ plant(i); showBanner(); } else seedBubble(i); return; }
      const c=CROPS[p.crop], left=c.time-(now()-p.start)/1000; const [wx,wy]=iso(x+.5,y+.3);
      openBubble(wx,wy,`<div class="nm">${c.icon} ${c.name}</div><div class="bar"><i style="width:${(1-left/c.time)*100}%"></i></div><div class="info">Ready in ${fmt(left)}</div>`); return; }
    const [wx,wy]=iso(x+.5,y+.2); openBubble(wx,wy,`<div class="nm">Overgrown plot</div><div class="info" style="margin-top:6px">This plot opens at level ${PLOT_LVL[i]}.</div>`); return;
  }
  if(h){
    if(plantMode){ plantMode=null; showBanner(); }
    if(h.kind==="prod") return openPanel("prod",h.ref);
    if(h.kind==="gift") return openGift(sx,sy);
    if(["barn","orders","roster"].includes(h.kind)) return openPanel(h.kind);
    if(h.kind==="zone"){ const z=ZONES.find(z=>z.id===h.ref); return toast(`${z.icon} ${z.name}: ${z.tease}. Opens at level ${z.lvl}. You're level ${S.lvl}.`); }
    if(h.kind==="site"){ const P=PROD[h.ref]; return toast(`The ${P.name} opens at level ${P.lvl}.`); }
  }
  closeBubble(); if(plantMode){ plantMode=null; showBanner(); }
}
addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeBubble(); closePanel(); plantMode=null; showBanner(); } });

/* ================= LOOP ================= */
function hud(){
  $("#coins").textContent=S.coins; $("#lvl").textContent=S.lvl;
  $("#xpbar").style.width=Math.min(100,S.xp/need(S.lvl)*100)+"%"; $("#xptxt").textContent=`${S.xp} / ${need(S.lvl)}`;
  const nx=unlocksAt(S.lvl+1); $("#nextup").textContent = nx.length? `Next: ${nx[0]}${nx.length>1?" +"+(nx.length-1):""}` : "";
  while(S.orders.length<3) S.orders.push(newOrder());
  const ord=readyOrders(); const ob=$("#ordBadge"); ob.hidden=!ord; ob.textContent=ord;
  let md=0; for(const p in S.prod) md+=S.prod[p].filter(j=>j.end<=now()).length; const mb=$("#millBadge"); mb.hidden=!md; mb.textContent=md;
}
let pressing=false;
addEventListener("pointerdown",()=>pressing=true,true);
addEventListener("pointerup",()=>setTimeout(()=>pressing=false,60),true);
addEventListener("pointercancel",()=>pressing=false,true);
let last=performance.now(), slow=0;
function frame(t){
  const dt=Math.min(.1,(t-last)/1000); last=t;
  stepAnimals(dt); stepParts(dt); draw(); placeBubble();
  slow+=dt; if(slow>.5){ slow=0; hud(); if(!pressing){ if(panel && !["levels","level","roster","help","wallet","menu","welcome"].includes(panel.kind)) renderPanel(); if(bubLive&&bub&&!$("#bubble").querySelector("input")) bubLive(); } }
  requestAnimationFrame(frame);
}
/* ---------- coin contract address (set on the server) ---------- */
function showCA(ca){
  const b=$("#ca"); ca=(ca||"").trim(); b.hidden=false;
  if(!ca){ $("#caFull").textContent="coming soon"; $("#caShort").textContent="coming soon"; b.title=""; b.classList.add("soon"); b.onclick=()=>toast("The contract address will show here at launch."); return; }
  b.classList.remove("soon");
  $("#caFull").textContent=ca; $("#caShort").textContent=ca.length>14? ca.slice(0,6)+"…"+ca.slice(-6) : ca; b.title=ca;
  b.onclick=()=>{ const done=()=>toast("Contract address copied");
    try{ navigator.clipboard.writeText(ca).then(done,()=>fallbackCopy(ca,done)); }catch(e){ fallbackCopy(ca,done); } };
}
function fallbackCopy(t,done){ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); done(); }catch(e){ toast(t); } ta.remove(); }
showCA("");

/* ---------- Solana wallet: sign in to save ---------- */
const shortAddr=a=>a.slice(0,4)+"…"+a.slice(-4);
function walletProvider(){ return (window.phantom&&window.phantom.solana) || window.solflare || (window.backpack&&window.backpack.solana) || window.solana || null; }
function setSaveState(st){ const el=$("#saveState"); if(!el) return; el.dataset.st=st; el.textContent={pending:"Saving…",saving:"Saving…",saved:"Saved",error:"Not saved, retrying"}[st]||""; }
function renderWallet(){
  const b=$("#walletBtn");
  if(NET.mode==="local"||NET.mode==="pending"){ b.hidden=true; return; }
  b.hidden=false;
  if(NET.mode==="wallet"){ b.classList.add("on"); b.innerHTML=`<i class="dot"></i><span>${shortAddr(NET.wallet)}</span><small id="saveState"></small>`; setSaveState(NET.dirty?"pending":"saved"); }
  else { b.classList.remove("on"); b.innerHTML=`<span class="long">Connect wallet · save farm</span><span class="short">Connect</span>`; }
}
function loadState(st){
  S=normalize(st); for(const k in RT) delete RT[k]; zoneTreeLvl=-1;
  closeBubble(); closePanel(); plantMode=null; showBanner(); hud(); renderGoal();
}
async function flushSave(){
  if(NET.mode!=="wallet"||!NET.token) return;
  clearTimeout(NET.t); NET.dirty=false; setSaveState("saving");
  try{
    const r=await fetch("/api/save",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+NET.token},body:JSON.stringify({state:S})});
    if(r.status===401){ sessionEnded("Your sign-in expired. Connect your wallet again to keep saving."); return; }
    if(!r.ok) throw new Error();
    if(!NET.dirty) setSaveState("saved");
  }catch(e){ NET.dirty=true; setSaveState("error"); clearTimeout(NET.t); NET.t=setTimeout(flushSave,8000); }
}
function beaconSave(){
  if(NET.mode==="wallet"&&NET.dirty&&navigator.sendBeacon){
    try{ navigator.sendBeacon("/api/save",new Blob([JSON.stringify({token:NET.token,state:S})],{type:"application/json"})); NET.dirty=false; }catch(e){}
  }
}
addEventListener("pagehide",beaconSave);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") beaconSave(); });
function sessionEnded(msg){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
  NET.mode="guest"; NET.wallet=null; NET.token=null; NET.dirty=false; renderWallet(); if(msg) toast(msg);
}
const toB64=u8=>{ let s=""; for(let i=0;i<u8.length;i++) s+=String.fromCharCode(u8[i]); return btoa(s); };
async function connectWallet(){
  const prov=walletProvider();
  if(!prov){ openPanel("wallet"); return; }
  const b=$("#walletBtn"); b.disabled=true;
  try{
    const r=await prov.connect();
    const pk=((r&&r.publicKey)||prov.publicKey).toString();
    const nr=await fetch("/api/nonce?wallet="+encodeURIComponent(pk)); const nj=await nr.json(); if(!nr.ok) throw new Error(nj.error);
    const signed=await prov.signMessage(new TextEncoder().encode(nj.message),"utf8");
    const sig=toB64(signed.signature||signed);
    const lr=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({wallet:pk,signature:sig})});
    const lj=await lr.json(); if(!lr.ok) throw new Error(lj.error);
    NET.mode="wallet"; NET.wallet=pk; NET.token=lj.token;
    try{ localStorage.setItem(SESSION_KEY,JSON.stringify({wallet:pk,token:lj.token})); localStorage.removeItem(KEY); }catch(e){}
    if(lj.save){ loadState(lj.save); toast("Welcome back! Your farm is loaded."); }
    else { toast("Wallet connected. Your farm saves automatically now."); NET.dirty=true; flushSave(); }
    renderWallet();
  }catch(e){
    const m=(e&&e.message)||""; toast(/reject|cancel|denied|closed/i.test(m)||!m ? "Wallet sign-in cancelled." : m);
  }finally{ b.disabled=false; }
}
function walletMenu(){
  const b=$("#walletBtn").getBoundingClientRect();
  closePanel(); bub={wx:0,wy:0}; bubLive=null;
  const el=$("#bubble"); el.hidden=false;
  el.innerHTML=`<div class="nm">Farm saved to</div><div class="info" style="word-break:break-all;margin:4px 0 8px">${NET.wallet}</div><div class="row"><button class="btn red" id="wOut">Disconnect</button></div>`;
  const place=()=>{ el.style.left=Math.min(W-el.offsetWidth/2-8,b.left+b.width/2)+"px"; el.style.top=(b.bottom+el.offsetHeight+18)+"px"; };
  place(); bub.place=place;
  $("#wOut").onclick=async()=>{ await flushSave(); try{ const p=walletProvider(); p&&p.disconnect&&p.disconnect(); }catch(e){}
    sessionEnded(); loadState(fresh()); closeBubble(); toast("Disconnected. You're playing as a guest now, so progress won't save."); };
}
$("#walletBtn").onclick=()=>{ if(NET.mode==="wallet") walletMenu(); else connectWallet(); };


async function initNet(){
  let cfg=null;
  try{ const r=await fetch("/api/config",{cache:"no-store"}); if(r.ok) cfg=await r.json(); }catch(e){}
  if(!cfg||!cfg.saves){ NET.mode="local"; renderWallet(); return; }
  showCA(cfg.ca); $("#guideBtn").href="/docs";
  NET.mode="guest";
  let sess=null; try{ sess=JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(e){}
  if(sess&&sess.token){
    try{
      const r=await fetch("/api/save",{headers:{"Authorization":"Bearer "+sess.token}});
      if(r.ok){ const j=await r.json(); NET.mode="wallet"; NET.wallet=sess.wallet; NET.token=sess.token;
        if(j.save) loadState(j.save); else { NET.dirty=true; flushSave(); } }
      else try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
    }catch(e){}
  }
  renderWallet();
  setInterval(()=>fetch("/api/config",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(c=>{ if(c) showCA(c.ca); }).catch(()=>{}),60000);
}
if(!SHOWCASE) initNet();
hud(); renderGoal(); requestAnimationFrame(frame);
// camera intro: ease in from a slightly wider view
if(!SHOWCASE && !matchMedia("(prefers-reduced-motion: reduce)").matches){
  const z1=cam.z, t0=performance.now(); cam.z=z1*.82; centerOn(12.5,9.5);
  (function ease(t){ const k=Math.min(1,(t-t0)/900), e=1-Math.pow(1-k,3); cam.z=z1*(.82+.18*e); centerOn(12.5,9.5); if(k<1) requestAnimationFrame(ease); })(t0);
}
let welcomed=false; try{ welcomed=!!localStorage.getItem("heehawday-welcomed"); }catch(e){}
if(!SHOWCASE && !welcomed && S.lvl===1 && S.xp===0) setTimeout(()=>openPanel("welcome"),700);
})();
</script>
