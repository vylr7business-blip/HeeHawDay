<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HeeHawDay · Coming Soon</title>
<meta name="description" content="HeeHawDay, the farm game starring HeeHaw the donkey, is coming soon. Follow @HeeHawDay on X.">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:title" content="HeeHawDay · Coming Soon">
<meta property="og:description" content="The farm game starring HeeHaw the donkey. Coming soon.">
<meta property="og:image" content="https://heehawday-production.up.railway.app/banner.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@HeeHawDay">
<meta name="twitter:image" content="https://heehawday-production.up.railway.app/banner.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: sky-and-sunburst stage; HeeHaw bobbing over the gold logo, a "Coming Soon" ribbon, trailer card, then follow + CA. Single sunny look. */
:root{
  --ink:#3a2414; --cream:#fff4d6; --gold:#ffc531; --red:#e04a2f; --red-dk:#a92d17; --grass:#9bdc4f; --grass-dk:#7ccb3d;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif; --body:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(#4fbdf0,#bfe9fb 60%,#d6f3ff);color:var(--ink);font-family:var(--body);font-weight:600;overflow-x:hidden;
  padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
.burst{position:fixed;left:50%;top:22vh;width:2400px;height:2400px;margin:-1200px 0 0 -1200px;z-index:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,250,200,.38) 0 7.5deg,rgba(255,255,255,.1) 7.5deg 15deg);
  border-radius:50%;animation:spin 80s linear infinite;mask:radial-gradient(circle,#000 18%,transparent 62%);-webkit-mask:radial-gradient(circle,#000 18%,transparent 62%)}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{position:fixed;z-index:1;pointer-events:none;width:260px;height:90px;filter:drop-shadow(0 8px 0 #cfe6f5)}
.cloud::before,.cloud::after,.cloud i{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:120px;height:120px;left:40px;top:-40px}.cloud::after{width:90px;height:90px;left:130px;top:-20px}.cloud i{left:0;top:10px;width:260px;height:80px;border-radius:40px}
.c1{left:-60px;top:12vh;animation:drift 38s linear infinite}.c2{right:-40px;top:6vh;transform:scale(.75);animation:drift 46s linear infinite reverse}.c3{left:8vw;bottom:24vh;transform:scale(.6);animation:drift 52s linear infinite}
@keyframes drift{50%{translate:40px 0}}
.hills{position:fixed;left:0;right:0;bottom:0;height:22vh;z-index:1;pointer-events:none}
.hills svg{width:100%;height:100%;display:block}
main{position:relative;z-index:2;max-width:760px;margin:0 auto;padding-block:28px 26vh;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.mascot{width:min(240px,52vw);aspect-ratio:1;animation:hop 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 0 rgba(58,36,20,.25))}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-16px) rotate(-3deg)}55%{transform:translateY(0) rotate(0)}62%{transform:scaleY(.95) scaleX(1.04)}}
.logo{margin:-12px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(54px,13vw,108px);line-height:1;letter-spacing:1px;
  background:linear-gradient(#fff6b0 0%,#ffd23f 45%,#f29a00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(3px 3px 0 var(--ink)) drop-shadow(-2px -2px 0 var(--ink)) drop-shadow(2px -2px 0 var(--ink)) drop-shadow(-2px 2px 0 var(--ink)) drop-shadow(0 6px 0 var(--ink))}
.ribbon{position:relative;display:inline-block;margin-top:2px;background:linear-gradient(#ff6a4c,var(--red));border:4px solid var(--ink);border-radius:12px;padding:6px 34px 9px;
  font-family:var(--display);font-weight:400;font-size:clamp(26px,6vw,40px);letter-spacing:1.5px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3);box-shadow:0 5px 0 var(--ink)}
.ribbon::before,.ribbon::after{content:"";position:absolute;top:14px;width:34px;height:100%;background:var(--red-dk);border:4px solid var(--ink);z-index:-1}
.ribbon::before{left:-30px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,30% 50%)}
.ribbon::after{right:-30px;clip-path:polygon(0 0,100% 0,70% 50%,100% 100%,0 100%)}
.lead{margin:6px 0 0;font-size:clamp(16px,2.6vw,19px);max-width:40ch;color:#2c4a5c;font-weight:600}
.trailer{width:100%;max-width:640px;margin-top:6px;background:var(--cream);border:5px solid var(--ink);border-radius:20px;box-shadow:0 7px 0 var(--ink);padding:8px;position:relative}
.trailer video{display:block;width:100%;aspect-ratio:16/9;border-radius:12px;background:#5a9430}
.sound{position:absolute;right:18px;bottom:18px;font-family:var(--display);font-weight:400;font-size:15px;color:#fff;background:rgba(58,36,20,.85);border:3px solid var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:400;font-size:20px;color:#fff;text-decoration:none;border-radius:16px;padding:10px 22px;border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn.x{background:linear-gradient(#333,#000)}
.btn svg{width:22px;height:22px}
.btn:active,.sound:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn:focus-visible,.sound:focus-visible,.ca:focus-visible{outline:3px solid #fff;outline-offset:3px}
.ca{display:inline-flex;align-items:center;gap:8px;background:var(--cream);border:4px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);padding:8px 14px;font-family:var(--body);font-size:16px;color:var(--ink);cursor:default}
.ca b{font-family:var(--display);font-weight:400;background:var(--gold);border:2px solid var(--ink);border-radius:7px;padding:0 7px}
.ca span{font-style:italic;color:#8a6440;overflow-wrap:anywhere}
.ca.live{cursor:pointer}.ca.live span{font-style:normal;color:var(--ink)}
.foot{margin:6px 0 0;font-size:13px;color:#2c4a5c}
.intro{display:flex;flex-direction:column;align-items:center;gap:12px}
@media (min-width:1000px){
  main{max-width:1180px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:44px;align-items:center;padding-block:7vh 18vh;min-height:100vh}
  .mascot{width:190px}
  .logo{font-size:92px}
  .trailer{max-width:none;transform:rotate(1.2deg)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="burst" aria-hidden="true"></div>
<div class="cloud c1" aria-hidden="true"><i></i></div><div class="cloud c2" aria-hidden="true"><i></i></div><div class="cloud c3" aria-hidden="true"><i></i></div>
<div class="hills" aria-hidden="true"><svg viewBox="0 0 1200 200" preserveAspectRatio="none">
  <path d="M0 70 Q160 20 330 55 T700 50 T1000 40 T1200 55 V200 H0Z" fill="#7ccb3d" stroke="#3a2414" stroke-width="5"/>
  <path d="M0 120 Q300 80 560 110 T1200 100 V200 H0Z" fill="#9bdc4f" stroke="#3a2414" stroke-width="5"/></svg></div>

<main>
  <div class="intro">
  <img class="mascot" src="/donkey.svg" alt="HeeHaw the donkey, mid-kick">
  <h1 class="logo">HeeHawDay</h1>
  <div class="ribbon">COMING SOON</div>
  <p class="lead">The farm game starring HeeHaw the donkey. Grow crops, raise animals and unlock new lands on Elsberry Farm.</p>
  <div class="row">
    <a class="btn x" href="https://x.com/HeeHawDay" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M17.75 3h3.07l-6.7 7.66L22 21h-6.17l-4.83-6.32L5.47 21H2.4l7.17-8.2L2 3h6.33l4.37 5.77L17.75 3zm-1.08 16.17h1.7L7.4 4.74H5.58l11.09 14.43z"/></svg>Follow @HeeHawDay</a>
    <button class="ca" id="ca" type="button"><b>CA</b><span id="caText">coming soon</span></button>
  </div>
  <p class="foot">Follow on X to hear the moment the gates open.</p>
  </div>

  <div class="trailer">
    <video id="trailer" src="/trailer.mp4" poster="/banner.png" autoplay muted loop playsinline preload="metadata"></video>
    <button class="sound" id="sound" type="button">🔇 Tap for sound</button>
  </div>
</main>

<script>
(() => {
  const v=document.getElementById("trailer"), s=document.getElementById("sound");
  s.onclick=()=>{ v.muted=!v.muted; if(!v.muted){ v.currentTime=0; v.play().catch(()=>{}); } s.textContent=v.muted?"🔇 Tap for sound":"🔊 Sound on"; };
  const ca=document.getElementById("ca");
  fetch("/api/config",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(c=>{
    const a=c&&(c.ca||"").trim(); if(!a) return;
    document.getElementById("caText").textContent=a; ca.classList.add("live"); ca.title="Copy contract address";
    ca.onclick=()=>{ try{ navigator.clipboard.writeText(a).then(()=>{ ca.querySelector("b").textContent="COPIED"; setTimeout(()=>ca.querySelector("b").textContent="CA",1400); }); }catch(e){} };
  }).catch(()=>{});
})();
</script>
</body>
</html>
