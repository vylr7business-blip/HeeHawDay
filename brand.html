<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HeeHawDay Brand Kit</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one column; each asset is a framed preview with its X size noted and a Download PNG button. */
:root{ --ink:#3a2414; --cream:#fff4d6; --grass:#86c847; --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif; --body:"Fredoka","Trebuchet MS",system-ui,sans-serif; color-scheme:light }
*{box-sizing:border-box}
body{margin:0;background:var(--grass);color:var(--ink);font-family:var(--body);font-weight:500;padding-block:24px 48px;padding-inline:16px}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1{font-family:var(--display);font-weight:400;color:#fff;font-size:44px;margin:0;text-align:center;text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 4px 0 var(--ink)}
.lead{text-align:center;color:#fff;margin:-8px 0 0;text-shadow:0 1px 0 var(--ink)}
.asset{background:var(--cream);border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:16px;display:flex;flex-direction:column;gap:12px}
.asset h2{font-family:var(--display);font-weight:400;margin:0;font-size:22px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.asset h2 small{font-family:var(--body);font-size:14px;color:#7d5a3a}
canvas{width:100%;height:auto;display:block;border-radius:12px;border:3px solid var(--ink);background:#cde9a6}
#logo{max-width:400px;align-self:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--display);font-weight:400;font-size:18px;color:#fff;border-radius:14px;padding:8px 20px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);background:linear-gradient(#7fd347,#46a11c);cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn:disabled{background:linear-gradient(#cfc5b0,#b3a68b);cursor:wait}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.status{font-size:14px;color:#7d5a3a}
iframe{position:fixed;left:0;top:0;width:1500px;height:500px;border:0;opacity:.01;pointer-events:none;z-index:-1}
</style>
</head>
<body>
<div class="wrap">
  <h1>HeeHawDay Brand Kit</h1>
  <p class="lead">Profile picture and header for X, drawn from the game itself.</p>

  <section class="asset">
    <h2>Profile picture <small>1000 × 1000 PNG · X shows it as a circle</small></h2>
    <canvas id="logo" width="1000" height="1000"></canvas>
    <div class="row"><button class="btn" id="dlLogo" disabled>Download PNG</button><span class="status" id="stLogo">Drawing…</span></div>
  </section>

  <section class="asset">
    <h2>Header banner <small>1500 × 500 PNG · X's header size</small></h2>
    <canvas id="banner" width="1500" height="500"></canvas>
    <div class="row"><button class="btn" id="dlBanner" disabled>Download PNG</button><span class="status" id="stBanner">Loading the farm…</span></div>
  </section>
</div>

<iframe id="farm" src="/?brand&z=1.05&cx=12.6&cy=9.4" title="Farm render" aria-hidden="true" tabindex="-1"></iframe>

<script>
(async () => {
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const INK = "#3a2414";
try { await Promise.all([document.fonts.load('100px "Lilita One"'), document.fonts.load('700 40px "Fredoka"')]); } catch (e) {}

// Chunky game-logo text: gold gradient, thick brown outline, drop shadow.
function logoText(ctx, text, x, y, size, opts = {}) {
  // Draw on a scratch canvas so the shine only lands on the letters.
  const font = `${size}px "Lilita One","Arial Rounded MT Bold",sans-serif`;
  ctx.save(); ctx.font = font; const w = ctx.measureText(text).width; ctx.restore();
  const pad = size * .4, cw = Math.ceil(w + pad * 2), ch = Math.ceil(size * 1.5);
  const t = document.createElement("canvas"); t.width = cw; t.height = ch; const c = t.getContext("2d");
  const bx = cw / 2, by = size * 1.05;
  c.font = font; c.textAlign = "center"; c.textBaseline = "alphabetic"; c.lineJoin = "round";
  c.lineWidth = size * .26; c.strokeStyle = INK; c.strokeText(text, bx, by + size * .07); c.strokeText(text, bx, by);
  c.lineWidth = size * .1; c.strokeStyle = opts.rim || "#8a4a14"; c.strokeText(text, bx, by);
  const f = document.createElement("canvas"); f.width = cw; f.height = ch; const fc = f.getContext("2d");
  fc.font = font; fc.textAlign = "center"; fc.textBaseline = "alphabetic";
  const g = fc.createLinearGradient(0, by - size * .8, 0, by + size * .05);
  [[0, "#fff6b0"], [.45, "#ffd23f"], [1, "#f29a00"]].forEach(([o, col]) => g.addColorStop(o, col));
  fc.fillStyle = g; fc.fillText(text, bx, by);
  fc.globalCompositeOperation = "source-atop"; fc.fillStyle = "rgba(255,255,255,.35)"; fc.fillRect(0, by - size * .8, cw, size * .22);
  c.drawImage(f, 0, 0);
  ctx.drawImage(t, x - bx, y - by);
}
function ribbon(ctx, cx, cy, w, h, text, size) {
  ctx.save(); ctx.lineJoin = "round"; ctx.lineWidth = 6; ctx.strokeStyle = INK;
  const tail = h * .55;
  for (const s of [-1, 1]) {
    ctx.beginPath(); const ex = cx + s * (w / 2 - 6);
    ctx.moveTo(ex, cy - h * .2); ctx.lineTo(ex + s * tail * 1.4, cy - h * .2); ctx.lineTo(ex + s * tail, cy + h * .25); ctx.lineTo(ex + s * tail * 1.4, cy + h * .7); ctx.lineTo(ex, cy + h * .7); ctx.closePath();
    ctx.fillStyle = "#a92d17"; ctx.fill(); ctx.stroke();
  }
  ctx.beginPath(); ctx.roundRect(cx - w / 2, cy - h / 2, w, h, 10); ctx.fillStyle = "#e04a2f"; ctx.fill(); ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,.25)"; ctx.fillRect(cx - w / 2 + 8, cy - h / 2 + 6, w - 16, h * .18);
  ctx.font = `${size}px "Lilita One",sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineWidth = size * .2; ctx.strokeStyle = INK; ctx.strokeText(text, cx, cy + 2); ctx.fillStyle = "#fff"; ctx.fillText(text, cx, cy + 2);
  ctx.restore();
}
function emoji(ctx, ch, x, y, size, flip) {
  ctx.save(); ctx.translate(x, y); if (flip) ctx.scale(-1, 1); ctx.fillStyle = "#000";
  ctx.font = `${size}px ${EMOJI}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(ch, 0, 0); ctx.restore();
}

/* ---------- profile picture ---------- */
function drawLogo() {
  const c = document.getElementById("logo"), ctx = c.getContext("2d"), S = c.width, m = S / 2;
  // sky
  let g = ctx.createLinearGradient(0, 0, 0, S); g.addColorStop(0, "#5fc3f0"); g.addColorStop(.6, "#bdeaff"); ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
  // sunburst
  ctx.save(); ctx.translate(m, S * .42);
  for (let i = 0; i < 24; i++) { ctx.rotate(Math.PI * 2 / 24); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-S * .07, -S); ctx.lineTo(S * .07, -S); ctx.closePath(); ctx.fillStyle = i % 2 ? "rgba(255,246,180,.55)" : "rgba(255,255,255,.18)"; ctx.fill(); }
  ctx.restore();
  // far hill + barn
  ctx.beginPath(); ctx.moveTo(0, S * .66); ctx.quadraticCurveTo(S * .3, S * .52, S * .62, S * .62); ctx.quadraticCurveTo(S * .85, S * .68, S, S * .58); ctx.lineTo(S, S); ctx.lineTo(0, S); ctx.closePath();
  ctx.fillStyle = "#7ccb3d"; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = INK; ctx.stroke();
  // barn
  const bx = S * .74, by = S * .6, bw = S * .17, bh = S * .12;
  ctx.lineWidth = 7; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.rect(bx, by - bh, bw, bh); ctx.fillStyle = "#d2402f"; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx - 12, by - bh); ctx.lineTo(bx + bw / 2, by - bh - S * .08); ctx.lineTo(bx + bw + 12, by - bh); ctx.closePath(); ctx.fillStyle = "#7d4a35"; ctx.fill(); ctx.stroke();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 6; const dx = bx + bw * .3, dw = bw * .4, dh = bh * .7;
  ctx.strokeRect(dx, by - dh, dw, dh); ctx.beginPath(); ctx.moveTo(dx, by - dh); ctx.lineTo(dx + dw, by); ctx.moveTo(dx + dw, by - dh); ctx.lineTo(dx, by); ctx.stroke();
  // near hill with field stripes
  ctx.save(); ctx.beginPath(); ctx.moveTo(0, S * .78); ctx.quadraticCurveTo(S * .5, S * .6, S, S * .76); ctx.lineTo(S, S); ctx.lineTo(0, S); ctx.closePath();
  ctx.fillStyle = "#9bdc4f"; ctx.fill(); ctx.clip();
  for (let i = -6; i < 14; i++) { ctx.beginPath(); ctx.moveTo(i * S * .1, S); ctx.lineTo(i * S * .1 + S * .35, S * .55); ctx.lineWidth = S * .03; ctx.strokeStyle = "rgba(94,154,52,.35)"; ctx.stroke(); }
  ctx.restore();
  ctx.beginPath(); ctx.moveTo(0, S * .78); ctx.quadraticCurveTo(S * .5, S * .6, S, S * .76); ctx.lineWidth = 8; ctx.strokeStyle = INK; ctx.stroke();
  // hay bales
  for (const [x, y] of [[S * .2, S * .74], [S * .28, S * .72]]) { ctx.beginPath(); ctx.roundRect(x - 40, y - 26, 80, 52, 10); ctx.fillStyle = "#f0c84a"; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke(); }
  // HeeHaw
  ctx.save(); ctx.beginPath(); ctx.ellipse(m, S * .63, S * .2, S * .045, 0, 0, 7); ctx.fillStyle = "rgba(40,70,10,.3)"; ctx.fill(); ctx.restore();
  emoji(ctx, "🫏", m, S * .45, S * .4, false);
  // name
  logoText(ctx, "HeeHaw", m, S * .79, S * .17);
  ribbon(ctx, m, S * .855, S * .26, S * .075, "DAY", S * .055);
  // round frame so the circle crop has a clean edge
  ctx.beginPath(); ctx.arc(m, m, m - 10, 0, 7); ctx.lineWidth = 20; ctx.strokeStyle = "#9a5b2c"; ctx.stroke();
  ctx.beginPath(); ctx.arc(m, m, m - 22, 0, 7); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
  ctx.beginPath(); ctx.arc(m, m, m - 2, 0, 7); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
  document.getElementById("stLogo").textContent = "Ready.";
  document.getElementById("dlLogo").disabled = false;
}
drawLogo();

/* ---------- header banner ---------- */
function drawBanner() {
  const c = document.getElementById("banner"), ctx = c.getContext("2d"), W = c.width, H = c.height;
  const frame = document.getElementById("farm");
  let src = null; try { src = frame.contentDocument.getElementById("cv"); } catch (e) {}
  if (src) ctx.drawImage(src, 0, 0, W, H);
  else { ctx.fillStyle = "#86c847"; ctx.fillRect(0, 0, W, H); }
  // soft light behind the title so it reads over the farm
  const rg = ctx.createRadialGradient(W * .62, H * .42, 20, W * .62, H * .42, W * .38);
  rg.addColorStop(0, "rgba(255,248,214,.62)"); rg.addColorStop(1, "rgba(255,248,214,0)"); ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  // title block (kept right of center: X puts the profile picture over the lower left)
  const tx = W * .62;
  emoji(ctx, "🫏", tx - 470, H * .34, 120, true);
  logoText(ctx, "HeeHawDay", tx, H * .47, 132);
  ribbon(ctx, tx, H * .64, 520, 56, "LIFE ON ELSBERRY FARM", 30);
  ctx.save(); ctx.font = '700 26px "Fredoka",sans-serif'; ctx.textAlign = "center"; ctx.lineJoin = "round";
  ctx.lineWidth = 7; ctx.strokeStyle = INK; ctx.strokeText("Grow · Feed · Ride · Rockmart, GA", tx, H * .82);
  ctx.fillStyle = "#fff"; ctx.fillText("Grow · Feed · Ride · Rockmart, GA", tx, H * .82); ctx.restore();
  document.getElementById("stBanner").textContent = src ? "Ready." : "Couldn't load the farm, so this one has a plain background.";
  document.getElementById("dlBanner").disabled = false;
}
const frame = document.getElementById("farm");
frame.addEventListener("load", () => setTimeout(drawBanner, 2500));
setTimeout(() => { if (document.getElementById("dlBanner").disabled) drawBanner(); }, 9000);

function download(canvas, name) {
  canvas.toBlob(b => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }, "image/png");
}
document.getElementById("dlLogo").onclick = () => download(document.getElementById("logo"), "heehawday-profile.png");
document.getElementById("dlBanner").onclick = () => { drawBanner(); download(document.getElementById("banner"), "heehawday-header.png"); };
})();
</script>
</body>
</html>
